name: guardrails

# From ~/repo-template (scripts/guardrails-sync.sh). Runs on every PR/push:
#   lint      pre-commit (ruff, shellcheck, house rules)
#   test      pytest
#   security  pip-audit + bandit
#   review    Claude code review posted on the PR (needs ANTHROPIC_API_KEY)
# Action SHAs verified to exist on 2026-09-11.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # ruff-format is a local auto-fixer, not a CI gate: several repos predate
      # it and a format-only red on every PR is noise, not signal.
      - name: pre-commit (all files)
        env:
          SKIP: ruff-format
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: house-rule hooks can fail (negative controls)
        run: bash scripts/guardrails-selftest.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras --dev
          else uv sync --all-extras --dev; fi
      - name: Tests
        run: uv run --with pytest pytest -q -p no:cacheprovider

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit (known-vulnerable dependencies)
        run: |
          uv sync --all-extras --dev
          uv run --with pip-audit pip-audit --strict --desc on
      - name: bandit (insecure code patterns, medium+ severity)
        run: uvx bandit -q -r . -ll -x ./tests,./.venv,./mutants

  review:
    # Automated Claude code review. Fails LOUD when the key is missing rather
    # than silently skipping: a review step that quietly no-ops is worse than
    # none, because the green check claims a review happened.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: ANTHROPIC_API_KEY is configured
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set on this repo. Add it: gh secret set ANTHROPIC_API_KEY -R ${{ github.repository }}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@4169884de317bc1b4cb1b47f4476d76fed92b384 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Report only findings you can point to a line for, most severe first.
            Bar: this code was largely machine-written, so hold it to a HIGHER
            bar than hand-written code. Check specifically for:
            1. Tests that cannot fail: assertions that pass on the broken code,
               negative checks with no positive control, fixtures that encode the
               belief under test, wall-clock budgets used as correctness checks.
            2. Guards whose predicate cannot observe what it must discriminate.
            3. Silent no-ops: bare str.replace(), unasserted return values,
               swallowed exceptions, fallbacks that hide failure.
            4. Correctness: off-by-one, unit/scale errors, wrong-name-right-value,
               regex backtracking, resource leaks, concurrency.
            5. Security: injection, path traversal, secrets, unsafe deserialisation.
            Ignore style. If nothing meets the bar, say so in one line.
            Post the review as a PR comment via gh.
          claude_args: |
            --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --max-turns 40

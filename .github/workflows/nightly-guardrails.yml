name: nightly-guardrails

# From ~/repo-template. Scheduled work no PR would trigger:
#   mutation  mutmut over the source; surviving mutants = the real coverage report
#   fuzz      Claude writes+runs adversarial property tests against public entry points (WEEKLY, per-repo weekday)
#   triage    Claude (Haiku) reads the surviving mutants and names the missing test per gap (WEEKLY, same weekday)
# Both open/refresh a GitHub issue with findings. Action SHAs verified 2026-09-11.

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC = 03:17 EDT, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      MUTMUT: "3.8.1" # also the results-cache key: a new mutmut starts clean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Opt-out with a written reason
        # A repo whose suite cannot run under mutmut (e.g. tests that parse
        # their own source text, which mutation rewrites) says so in
        # .github/mutation-opt-out.md. The reason lands in the job summary
        # every night so the opt-out stays visible, not silent.
        id: optout
        run: |
          if [ -f .github/mutation-opt-out.md ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            { echo "## Mutation testing opted out"; cat .github/mutation-opt-out.md; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::mutation opted out: $(head -1 .github/mutation-opt-out.md)"
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.optout.outputs.skip != '1'
        with:
          enable-cache: true
      - name: Install + mutmut
        if: steps.optout.outputs.skip != '1'
        run: |
          # Repo-specific system prerequisites (R for rpy2, OpenCV libs, ...) live in
          # scripts/guardrails-setup.sh so the template stays generic.
          if [ -x scripts/guardrails-setup.sh ]; then bash scripts/guardrails-setup.sh; fi
          # assignment, not inline $(...): a helper failure must stop the step
          extras_s=$(python3 scripts/uv_extras.py)
          read -ra extras <<<"$extras_s"
          uv sync "${extras[@]}" --dev
          if [ -f requirements-dev.txt ]; then uv pip install -r requirements-dev.txt; fi
          # mutmut 3.7's stats plugin read pytest's private Item._nodeid, which
          # pytest 9.2 removed (figcite, ldraw-mcp 2026-10-28: 0 checked); 3.8
          # reads .nodeid. A pin added here needs UV_NO_SYNC=1 in $GITHUB_ENV:
          # `uv run` re-syncs to the lock and undoes it.
          uv pip install "mutmut==$MUTMUT" pytest
      - name: Baseline suite is green (a red baseline makes every mutant "killed")
        if: steps.optout.outputs.skip != '1'
        run: uv run --with pytest pytest -q -x -p no:cacheprovider
      - name: This ISO week (the results cache starts clean each week)
        # and on a new Python: mutmut keeps a result only while its function's
        # hash is unchanged, and the hash is of ast.dump(), whose text differs
        # between Pythons. ubuntu-latest moved to 26.04 on 2026-10-28 (python3
        # 3.12 -> 3.14): every carried result was dropped mid-week and the cap
        # re-ran them from scratch (data-aggregator-mcp, phylokit-mcp; the gate
        # read the unfinished tail as a stall).
        if: steps.optout.outputs.skip != '1'
        id: week
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          # assignment, not inline $(...): a failed probe must stop the step, not key on "py"
          py=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "python=$py" >> "$GITHUB_OUTPUT"
      - name: Restore this week's mutant results
        # The 90-minute cap left the same tail unchecked every night, because
        # each night started from nothing (data-aggregator-mcp 2026-10-16/17/19:
        # 489, 520 and 1,298 mutants never checked). mutmut keeps a result
        # in mutants/<file>.meta and, on regenerating a file, keeps it only if
        # its function's source hash is unchanged, so last night's results can
        # resume. Only the .meta files are cached: the mutated sources are
        # regenerated, and mutmut-stats.json is left out so the test-to-function
        # map is recollected every night, as before. mutants/.carry-tests holds the
        # git blob id of each test file every result stands under, and the mutants
        # waiting for a recheck because a test that covers them changed;
        # mutants/.carry-stuck counts the nights each mutant was cut off by the cap.
        # The path list is part of the cache version: a list changed mid-week
        # misses every entry saved under the old one (2026-10-24: adding
        # .carry-stuck restored nothing in all 7 mutating repos). New state goes
        # inside a file already listed; the carry step warns on a mid-week miss.
        if: steps.optout.outputs.skip != '1'
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/.carry-tests
            mutants/.carry-stuck
          key: mutmut-${{ env.MUTMUT }}-py${{ steps.week.outputs.python }}-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutmut-${{ env.MUTMUT }}-py${{ steps.week.outputs.python }}-${{ steps.week.outputs.week }}-
      - name: Carry results the code and tests still stand behind
        # A kill stands until its function changes (mutmut resets it then) or
        # the week ends. A survivor stands until a test that covers its function
        # is added or changed: that test may kill it, and mutmut's hash follows
        # the source, not the tests. Which tests cover a function is known only
        # once tonight's run has collected its stats, so survivors carry here and
        # the step after the run resets the ones a changed test covers; they are
        # rechecked the next night. Survivors are the slowest mutants (no early
        # failure), so rechecking them every night would spend the cap on them
        # (taxon3d: 3,399 survivors on 2026-10-19).
        # Timeouts stand on the same terms as survivors, and for the same
        # reason: each costs the full per-mutant timeout to recheck. Rechecking
        # them every night spent phylokit-mcp's whole cap (2026-10-21: 86
        # timeouts, ~55 s each, 13 first checks, 1,578 left unchecked).
        # "No tests" and the rest are rechecked every run.
        if: steps.optout.outputs.skip != '1'
        id: carry
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          uv run python - <<'PY'
          import collections, datetime, json, os, pathlib
          from mutmut.__main__ import status_by_exit_code
          # The week's first run (Monday, UTC) starts clean by design; any later
          # run that restored nothing checks the whole tree again from scratch.
          if not os.environ["MATCHED"] and datetime.datetime.now(datetime.timezone.utc).isoweekday() != 1:
              print("::warning::no results restored from earlier runs this week: every mutant is checked "
                    "from scratch tonight. A new Python or a changed cache path list is a new cache version "
                    "and misses every entry saved before it; so does an evicted or expired cache.")
          try:
              base = json.loads(pathlib.Path("mutants/.carry-tests").read_text())
              recheck = set(base["recheck"])
              known = isinstance(base["tests"], dict)
          except (FileNotFoundError, ValueError, TypeError, KeyError):
              # first run of the week, or a fingerprint from before per-file
              # tests: what the tests were is unknown, so only kills carry
              recheck, known = set(), False
          keep = {"killed", "caught by type check"} | ({"survived", "timeout"} if known else set())
          carried, reset, reset_status, hashes = [], [], [], {}
          for meta in sorted(pathlib.Path("mutants").rglob("*.meta")):
              d = json.loads(meta.read_text())
              hashes[str(meta)] = d.get("hash_by_function_name", {})
              for k, c in d["exit_code_by_key"].items():
                  if c is None:
                      if k in recheck:  # reset after the last run: a test covering it changed
                          reset.append(k)
                          reset_status.append("covered by a changed test")
                      continue
                  if status_by_exit_code[c] in keep:
                      carried.append(k)
                  else:
                      d["exit_code_by_key"][k] = None
                      reset.append(k)
                      reset_status.append(status_by_exit_code[c])
              meta.write_text(json.dumps(d))
          # no recheck is owed to a test change: the gate's stall rule applies
          same_tests = known and "covered by a changed test" not in reset_status
          pathlib.Path(os.environ["RUNNER_TEMP"], "carried.txt").write_text("".join(k + "\n" for k in carried))
          # the function hashes these results were carried under (the step after the run)
          pathlib.Path(os.environ["RUNNER_TEMP"], "carried-hashes.json").write_text(json.dumps(hashes))
          pathlib.Path(os.environ["RUNNER_TEMP"], "reset.txt").write_text("".join(k + "\n" for k in reset))
          by_status = collections.Counter(reset_status)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"carried={len(carried)}\nreset={len(reset)}\nsame_tests={int(same_tests)}\n")
          print(f"carried {len(carried)} results from earlier runs this week "
                f"({'survivors and timeouts too, checked against changed tests after the run' if known else 'first run or tests unknown: kills only'}); "
                f"{len(reset)} others to recheck"
                + (f" ({', '.join(f'{n} {s}' for s, n in by_status.most_common())})" if reset else ""))
          PY
      - name: Run mutants (wall-clock capped; results persist incrementally)
        if: steps.optout.outputs.skip != '1'
        # No .pyc: a same-size source swap can leave a stale bytecode file that
        # still runs as the mutant (or as the original) after the swap.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        id: run
        run: |
          # Every 20 s, note which mutants are running and for how long: mutmut
          # titles each child "mutmut: <name>" (setproctitle; off on macOS, where
          # the note stays empty). The last note names the mutants the cap cut off.
          inflight="$RUNNER_TEMP/inflight.txt"
          : > "$inflight"
          (
            while sleep 20; do
              ps -eo etimes=,args= | sed -n 's/^ *\([0-9][0-9]*\) mutmut: \([^ ]*\)$/\2 \1/p' > "$inflight.tmp"
              mv "$inflight.tmp" "$inflight"
            done
          ) &
          watcher=$!
          set +e
          timeout 90m uv run mutmut run
          rc=$?
          set -e
          kill "$watcher"
          echo "mutmut exit: $rc (124 = wall-clock cap, fine if mutants were checked)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: A mutant the cap cuts off two nights running is a timeout
        # mutmut's own deadline is (estimated test time + 1) x timeout_multiplier
        # (15) seconds, so a mutant most tests cover gets hours: data-aggregator-mcp's
        # suite takes ~11 min, and the cap leaves ~67 min after stats. mutmut
        # never gives such a mutant a result; it restarts every night and the
        # tail never shrinks (2026-10-21/22: the same 2 mutants, cut off after
        # 23 and 66 min). Restarted first among the unchecked, a mutant the cap
        # cuts off again after 30+ min has outrun any test it has: a timeout.
        if: steps.optout.outputs.skip != '1'
        id: cutoff
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          uv run python - <<'PY'
          import json, os, pathlib
          from mutmut.__main__ import status_by_exit_code
          TIMEOUT = 36  # several codes read "timeout"; 36 is mutmut's own
          assert status_by_exit_code[TIMEOUT] == "timeout", status_by_exit_code[TIMEOUT]
          stuck_f = pathlib.Path("mutants/.carry-stuck")
          before = json.loads(stuck_f.read_text()) if stuck_f.exists() else {}
          inflight = {}
          if os.environ["RC"] == "124":  # only the cap cuts a mutant off
              for line in pathlib.Path(os.environ["RUNNER_TEMP"], "inflight.txt").read_text().splitlines():
                  name, secs = line.split()
                  inflight[name] = int(secs)
          now, marked = {}, []
          for meta in sorted(pathlib.Path("mutants").rglob("*.meta")):
              d = json.loads(meta.read_text())
              changed = False
              for k, c in d["exit_code_by_key"].items():
                  if c is not None or k not in inflight:
                      continue
                  nights = before.get(k, 0) + 1
                  if nights >= 2 and inflight[k] >= 30 * 60:
                      d["exit_code_by_key"][k] = TIMEOUT
                      marked.append(k)
                      changed = True
                  else:
                      now[k] = nights
              if changed:
                  meta.write_text(json.dumps(d))
          stuck_f.parent.mkdir(exist_ok=True)
          stuck_f.write_text(json.dumps(now, indent=1, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cutoff={len(now)}\nmarked={len(marked)}\n")
          for k in marked:
              print(f"timeout: {k} (cut off by the cap two nights running, {inflight[k] // 60} min tonight)")
          for k, n in sorted(now.items()):
              print(f"cut off: {k} after {inflight[k] // 60} min ({n} night{'s' if n > 1 else ''} running)")
          PY
      - name: A carried survivor or timeout a changed test covers is rechecked
        # The carry used to reset every survivor and timeout when any file
        # under tests/ changed: phylokit-mcp 2026-10-25 changed one benchmark
        # test that imports no package code, and 231 rechecks (87 timeouts)
        # took the cap; 1 mutant got its first check, 1,589 waited. Tonight's
        # stats name the tests that cover each function, so a carried result is
        # reset only if one of those tests sits in a test file added or changed
        # since the results were made (git blob ids in mutants/.carry-tests),
        # or no test covers it now. A changed file under tests/ that no test
        # came from (conftest.py, a helper, data) can change any test: then
        # every carried survivor and timeout is reset, as before. A reset one is
        # listed in .carry-tests and rechecked the next night.
        if: steps.optout.outputs.skip != '1'
        id: tests
        run: |
          git ls-files -s | awk -F'\t' '$2 ~ /(^|\/)(tests?\/|conftest\.py$)/ { split($1, a, " "); print a[2] "\t" $2 }' > "$RUNNER_TEMP/tests.txt"
          uv run python - <<'PY'
          import json, os, pathlib, re
          from mutmut.__main__ import load_stats, mangled_name_from_mutant_name, status_by_exit_code, tests_for_mutant_names
          from mutmut.state import state
          tmp = os.environ["RUNNER_TEMP"]
          now = dict(line.split("\t", 1)[::-1] for line in pathlib.Path(tmp, "tests.txt").read_text().splitlines())
          fp = pathlib.Path("mutants/.carry-tests")
          try:
              base = json.loads(fp.read_text())
              old, recheck = dict(base["tests"]), set(base["recheck"])
          except (FileNotFoundError, ValueError, TypeError, KeyError):
              old, recheck = None, set()  # unknown: the carry step kept kills only
          changed = sorted(p for p in old.keys() | now.keys() if old.get(p) != now.get(p)) if old is not None else []
          has_stats = load_stats()
          ran = {t.split("::", 1)[0] for t in state().duration_by_test} if has_stats else set()
          deleted_test = re.compile(r"(^|/)(test_[^/]*|[^/]*_test)\.py$")  # a gone test kills nothing
          unexplained = [p for p in changed if p not in ran and not (p not in now and deleted_test.search(p))]
          every = old is None or (bool(changed) and (not has_stats or bool(unexplained)))
          carried = set(pathlib.Path(tmp, "carried.txt").read_text().split())
          carried_hashes = json.loads(pathlib.Path(tmp, "carried-hashes.json").read_text())
          stale, waiting = [], set()
          for meta in sorted(pathlib.Path("mutants").rglob("*.meta")):
              d = json.loads(meta.read_text())
              before, after = carried_hashes.get(str(meta), {}), d.get("hash_by_function_name", {})
              dirty = False
              for k, c in d["exit_code_by_key"].items():
                  if c is None:
                      if k in recheck:
                          waiting.add(k)
                      continue
                  if k not in carried or status_by_exit_code[c] not in ("survived", "timeout"):
                      continue
                  # Its function changed, so mutmut dropped the carried result and
                  # checked it again tonight, under tonight's tests: it stands.
                  func = mangled_name_from_mutant_name(k).rpartition(".")[2]
                  if before.get(func) != after.get(func):
                      continue
                  if not every:
                      if not has_stats:
                          continue  # no tests changed, so the result stands
                      # the same lookup mutmut's run makes for this mutant
                      covering = {t.split("::", 1)[0] for t in tests_for_mutant_names([k.replace("__init__.", "")])}
                      if covering and not covering & set(changed):
                          continue
                  d["exit_code_by_key"][k] = None
                  stale.append(k)
                  dirty = True
              if dirty:
                  meta.write_text(json.dumps(d))
          fp.parent.mkdir(exist_ok=True)
          fp.write_text(json.dumps({"tests": now, "recheck": sorted(waiting | set(stale))}, indent=1, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale={len(stale)}\n")
          shown = ", ".join(changed[:10]) + (f" and {len(changed) - 10} more" if len(changed) > 10 else "")
          print(f"test files changed since the carried results: {len(changed)}" + (f" ({shown})" if changed else ""))
          if every and changed:
              why = f"{', '.join(unexplained[:5])} changed and no test came from it" if has_stats else "no stats to map tests to functions"
              print(f"{why}: every carried survivor and timeout is rechecked")
          print(f"{len(stale)} carried survivors and timeouts reset for a recheck next run"
                + (f" (e.g. {', '.join(stale[:5])})" if stale else ""))
          PY
      - name: Save the results for the next run
        # always(): the gate below goes red on purpose, and a partial run's
        # results are still results (each is saved as its mutant finishes).
        if: always() && steps.run.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/.carry-tests
            mutants/.carry-stuck
          # the restore step's key, resolved: one definition, so a part added to
          # it (the Python, 2026-10-28) cannot miss the key a restore matches
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Survivors
        id: survivors
        if: steps.optout.outputs.skip != '1'
        # mutmut runs the suite inside its mutants/ COPY, not the checkout the
        # baseline step proved green. If that copy lacks a file the tests read
        # (also_copy) or the package cannot be found (source_paths), mutmut
        # aborts before checking a single mutant and every line reads
        # "not checked". That is a broken gate, not a clean result: fail here.
        # 2026-09-13: 7 repos, 3 nights, 0 mutants checked, all green.
        # `mutmut results` omits KILLED mutants by design; only --all lists them.
        # Counting from the short list read "0 killed" on 2,000 checked mutants.
        # 2026-09-16: plantcv-mcp, mutmut crashed (KeyError reaping a child) at
        # 4,233 of 8,576 with exit 1; the job was green and the issue was titled
        # "649 surviving mutants" as if that were the whole tree. An exit that is
        # neither 0 nor the cap's 124 is an ABORT: the counts are partial, the
        # issue says so, and the job goes red (below, after the issue is written).
        # Carried kills count as checked, so "checked" alone can no longer see a
        # run that checked nothing: `new` counts only the results this run made.
        # `new` also counts rechecks of results the carry step reset, so a run
        # can spend its whole cap rechecking and still look busy (phylokit-mcp
        # 2026-10-21: new 99, of them 86 rechecks). `first` counts only mutants
        # that had no result before this run: the unchecked tail shrinking.
        env:
          RC: ${{ steps.run.outputs.rc }}
          CARRIED: ${{ steps.carry.outputs.carried }}
          CUTOFF: ${{ steps.cutoff.outputs.cutoff }}
          MARKED: ${{ steps.cutoff.outputs.marked }}
          STALE: ${{ steps.tests.outputs.stale }}
        run: |
          uv run mutmut results > survivors.txt || true
          uv run mutmut results --all true > all-mutants.txt || true
          n=$(grep -c ": survived" survivors.txt || true)
          killed=$(grep -c ": killed" all-mutants.txt || true)
          unchecked=$(grep -c ": not checked$" all-mutants.txt || true)
          checked=$(grep -vcE ": not checked$|^$" all-mutants.txt || true)
          # assignment, not `read < <(...)`: a crash here must stop the step
          counts=$(python3 - <<'PY'
          import os
          tmp = os.environ["RUNNER_TEMP"]
          carried = set(open(os.path.join(tmp, "carried.txt")).read().split())
          reset = set(open(os.path.join(tmp, "reset.txt")).read().split())
          rows = [l.strip().rsplit(": ", 1) for l in open("all-mutants.txt") if ": " in l]
          made = [name for name, status in rows if status != "not checked" and name not in carried]
          print(len(made), sum(1 for name in made if name not in reset))
          PY
          )
          read -r new first <<<"$counts"
          aborted=0
          if [ "$RC" != "0" ] && [ "$RC" != "124" ]; then aborted=1; fi
          # Diffs for the triage step, dumped HERE: 2026-09-16 ldraw-mcp, the
          # Haiku triage spent all 40 turns running `mutmut show` one mutant per
          # turn and never wrote its comment ($0.48, nothing). Round-robin over
          # modules so one fat module cannot crowd the rest out.
          python3 - <<'PY' > survivor-diffs.txt || true
          import collections, itertools, subprocess
          names = [l.split(':')[0].strip() for l in open('survivors.txt') if ': survived' in l]
          by = collections.defaultdict(list)
          for n in names: by[n.rsplit('.', 1)[0]].append(n)
          picked = [n for n in itertools.chain.from_iterable(itertools.zip_longest(*by.values())) if n][:50] if by else []
          for n in picked:
              d = subprocess.run(['uv', 'run', 'mutmut', 'show', n], capture_output=True, text=True, timeout=60).stdout
              print(f"### {n}\n{d.strip()}\n")
          PY
          {
            echo "count=$n"; echo "unchecked=$unchecked"; echo "aborted=$aborted"; echo "checked=$checked"; echo "new=$new"; echo "first=$first"
          } >> "$GITHUB_OUTPUT"
          echo "## Mutants: $killed killed, $n survived, $checked checked ($new this run, $first of them first checks; $CARRIED carried from earlier this week, ${STALE:-0} of them reset after the run because a test that may cover them changed; ${MARKED:-0} timeouts the cap cut off twice), $unchecked unchecked, ${CUTOFF:-0} of them cut off by the cap (mutmut exit $RC, aborted=$aborted)" >> "$GITHUB_STEP_SUMMARY"
          head -200 survivors.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.optout.outputs.skip != '1'
        with:
          name: mutmut-survivors
          path: |
            survivors.txt
            survivor-diffs.txt
      - name: Upsert tracking issue
        id: upsert
        if: steps.optout.outputs.skip != '1' && steps.survivors.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.survivors.outputs.count }}
          UNCHECKED: ${{ steps.survivors.outputs.unchecked }}
          ABORTED: ${{ steps.survivors.outputs.aborted }}
        run: |
          title="nightly: $N surviving mutants"
          # A partial run is not a survivor count; say so where it is read.
          if [ "$ABORTED" = "1" ]; then title="$title (PARTIAL: mutmut aborted, $UNCHECKED unchecked)"
          elif [ "${UNCHECKED:-0}" != "0" ]; then title="$title ($UNCHECKED unchecked at the wall-clock cap)"; fi
          # shellcheck disable=SC2016  # printf format string is literal by design
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\nEach survivor is a line of code no test observes.\n\n```\n%s\n```\n' \
                  "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(head -150 survivors.txt)")"
          num=$(gh issue list --label mutation --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --title "$title" --body "$body"
          else
            gh label create mutation --color 8B0000 --force >/dev/null
            # Take the number from the create call's URL. Re-listing right after
            # a create returned NOTHING (figcite 2026-09-17, index lag): the
            # triage prompt then read "issue #", Haiku spent 37 turns and $0.69
            # with 14 permission denials, posted nowhere, and the step was green.
            url=$(gh issue create --label mutation --title "$title" --body "$body")
            num=${url##*/}
          fi
          case "$num" in ''|*[!0-9]*) echo "::error::could not determine the tracking issue number (got '$num')"; exit 1;; esac
          echo "issue=$num" >> "$GITHUB_OUTPUT"
      - name: Gate verdict (after the issue is written, so the record is accurate even when red)
        if: steps.optout.outputs.skip != '1'
        env:
          CHECKED: ${{ steps.survivors.outputs.checked }}
          NEW: ${{ steps.survivors.outputs.new }}
          FIRST: ${{ steps.survivors.outputs.first }}
          SAME_TESTS: ${{ steps.carry.outputs.same_tests }}
          CUTOFF: ${{ steps.cutoff.outputs.cutoff }}
          ABORTED: ${{ steps.survivors.outputs.aborted }}
          UNCHECKED: ${{ steps.survivors.outputs.unchecked }}
          STALE: ${{ steps.tests.outputs.stale }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          # Results reset after the run (a test covering them changed) were not
          # there for this run to check: only the rest waited on it.
          waited=$(( ${UNCHECKED:-0} - ${STALE:-0} ))
          if [ "${CHECKED:-0}" -eq 0 ]; then
            echo "::error::mutmut checked 0 mutants. The suite is not green inside mutants/: fix [tool.mutmut] also_copy / source_paths in pyproject.toml or the test that assumes the checkout path. See the stats-collection failure above."
            exit 1
          fi
          # Every unchecked mutant was running when the cap hit: mutmut ran, and
          # the tail clears itself (cut off again after 30+ min, each counts as
          # a timeout; the step after the run).
          all_cut=0
          if [ "$waited" -gt 0 ] && [ "${CUTOFF:-0}" -eq "$waited" ]; then all_cut=1; fi
          if [ "${NEW:-0}" -eq 0 ] && [ "$waited" -gt 0 ] && [ "$all_cut" = "0" ]; then
            echo "::error::mutmut checked no mutant this run while $waited waited; the $CHECKED checked are carried from earlier runs. The suite is not green inside mutants/ (see above)."
            exit 1
          fi
          # Rechecks after a test change are real work (the tests that judged
          # them changed); rechecks under unchanged tests that fill the cap are
          # a stall the tail never recovers from before the week's cache resets.
          if [ "${FIRST:-0}" -eq 0 ] && [ "$waited" -gt 0 ]; then
            if [ "$all_cut" = "1" ]; then
              echo "::warning::all $waited mutants still unchecked were running when the cap hit (the cut-off step's log names them): mutmut's own deadline for them is longer than the cap. Cut off again after 30+ min, each counts as a timeout."
            elif [ "$SAME_TESTS" = "1" ]; then
              echo "::error::no unchecked mutant got its first check while $waited waited. The cap went on $NEW rechecks of earlier results (the carry step's log gives their statuses) and ${CUTOFF:-0} mutants still running when it hit (the cut-off step's log names them). Carry a rechecked status that should stand, or find why the rest never start."
              exit 1
            else
              echo "::warning::earlier results a changed test covers were rechecked ($NEW results this run) and no unchecked mutant got its first check ($waited wait for the next run)."
            fi
          fi
          if [ "$ABORTED" = "1" ]; then
            echo "::error::mutmut aborted (exit $RC) with $UNCHECKED mutants unchecked; the survivor count is partial. Read the traceback above the exit line."
            exit 1
          fi
      - name: Triage day? (the repo's fuzz weekday, or a dispatch)
        id: triage
        if: steps.optout.outputs.skip != '1' && steps.survivors.outputs.count != '0'
        run: |
          n=$(printf '%s' "${{ github.repository }}" | cksum | cut -d' ' -f1)
          mine=$(( n % 7 + 1 )); today=$(date -u +%u)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$mine" = "$today" ]; then
            # if/then, not `[ ] && echo`: as the last command of the step an
            # and-list with a false test exits 1, and a repo without the token
            # would go red on its triage day instead of skipping.
            if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then echo "run=1" >> "$GITHUB_OUTPUT"
            else echo "::notice::triage day, but CLAUDE_CODE_OAUTH_TOKEN is not set: survivor triage skipped"; fi
          fi
      - name: Survivor triage (weekly; Haiku; names the missing test per real gap)
        # A surviving mutant is the coverage report, but a list of 300 names is
        # not readable. Once a week Claude reads the diffs, separates equivalent
        # mutants from real gaps, and writes the test that would kill each gap
        # into the tracking issue. Haiku: the task is classify-and-name, and this
        # runs on the same subscription token as everything else.
        if: steps.triage.outputs.run == '1'
        uses: anthropics/claude-code-action@4169884de317bc1b4cb1b47f4476d76fed92b384 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Triage surviving mutants for ${{ github.repository }}. Budget: 30 turns;
            post the comment by turn 15 even if partial (a partial triage beats
            none, and the step is red if you never post). The hard cap is higher
            than your budget on purpose: your own turn count runs low.
            survivor-diffs.txt already holds the diff of up to 50 survivors,
            one "### <name>" block each, round-robin across modules. Read that
            ONE file first; do not run mutmut. survivors.txt is the full list.
            1. Classify each diff: EQUIVALENT (behaviour unchanged: dead branch,
               log/CLI text, defensive check) or GAP (behaviour changed and no
               test observed it).
            2. For EVERY gap, one bullet, this exact shape, no grouping:
               `<mutant name>` | <what changed, <=12 words> | `tests/<file>.py::test_<name>` | `assert <the one assertion>`
               The test name must be new or an existing test in that file
               (Grep tests/ for it); the assertion must be a concrete
               expression on the mutated behaviour, not a description.
               THE ASSERTION MUST FAIL ON THE MUTANT AND PASS ON THE ORIGINAL.
               Check each one against the diff before writing it. These cannot
               fail and are not findings (all seen 2026-09-17, taxon3d):
               `assert len(x) > 0 or len(x) == 0` (true for every x);
               `assert max_tokens == 32000`, `assert attempts == 5`
               (a name the test itself would have to set: assert what the CALLER
               observes, e.g. the argument a mock received); `assert isinstance(r, dict)`
               when the mutant also returns a dict. If you cannot name an
               observable that differs, classify the mutant EQUIVALENT-OR-UNOBSERVABLE
               and count it separately; do not invent an assertion.
               A line without a backticked test id and an assert is not a
               finding; drop it rather than summarise.
            3. Post ONE comment on issue #${{ steps.upsert.outputs.issue }} via
               `gh issue comment --body-file <file you wrote under /tmp>`:
               heading "## Triage <UTC date> (Haiku)", then
               "triaged N / equivalent N / gaps N", then the gap bullets
               (all of them, one per line), then at most 2 lines "pattern:"
               if several gaps share a cause. No other prose, no summaries
               of groups, no advice paragraphs.
            4. The comment is the deliverable. Once `gh issue comment` has
               succeeded, STOP: say "posted" and take no further action. The
               step is red if you run out of turns, even after posting
               (2026-09-17: posted at turn ~20, then kept grepping to 41).
            Never modify tracked files. Never commit. Do not open new issues.
          # Path-scoped write rules are spelled Edit(...), which also governs the
          # Write tool; a path-scoped Write(...) rule matches nothing. A leading
          # single slash is project-relative: the real /tmp is //tmp. Until
          # 2026-09-30 this read Write(/tmp/*) and every /tmp write was denied.
          # The `no-pathscoped-write-rule` pre-commit hook rejects both forms.
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowed-tools "Bash(gh issue comment:*),Bash(gh issue view:*),Read,Edit(//tmp/**),Grep,Glob"
            --max-turns 60
      - name: Triage was actually posted BY THIS RUN (the comment is the deliverable)
        # The action is green whenever the model stops cleanly; that is not
        # "posted". Read the issue back, and accept only a comment created after
        # this run started: until 2026-09-19 any comment carrying today's heading
        # counted, so a second dispatch on the same day could post nothing and
        # pass on the first one's comment.
        #
        # There is deliberately NO lint of the posted assertions here. Two were
        # tried (a tautology regex, an AST "bare name" check) and both were wrong
        # in both directions: `assert f() == True or False` is not a tautology
        # (it fails when f() is false) and was flagged; `assert local["n"] == 5`
        # observes nothing and passed. Whether an assertion can fail is decided
        # by running it against the mutant, not by its shape. Until that exists,
        # the triage is a reading list for a person, not a verdict.
        if: steps.triage.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.upsert.outputs.issue }}
        run: |
          today=$(date -u +%Y-%m-%d)
          start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          case "$start" in 20??-??-??T*) ;; *) echo "::error::could not read this run's start time (got '$start')"; exit 1 ;; esac
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            | jq -s --arg start "$start" --arg h "## Triage $today" \
              '[.[][] | select(.created_at >= $start) | select(.body | contains($h))] | length')
          if [ "$n" = 0 ]; then
            echo "::error::no '## Triage $today' comment on issue #$ISSUE created since this run started ($start): the triage step posted nothing"; exit 1
          fi
          echo "triage comment from this run present on #$ISSUE"

  audit:
    # The calendar's question: has a CVE been published against what is ALREADY
    # on the default branch? Daily, no model, a minute of runner time. A finding
    # opens (or updates) one `dependency-audit` issue and the job is red; a clean
    # run closes it. It never blocks a PR: guardrails.yml audits a PR only when
    # that PR changes a dependency file.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: pip-audit the default branch's resolved dependencies
        id: audit
        run: |
          if [ -x scripts/guardrails-setup.sh ]; then bash scripts/guardrails-setup.sh; fi
          # assignment, not inline $(...): a helper failure must stop the step
          extras_s=$(python3 scripts/uv_extras.py)
          read -ra extras <<<"$extras_s"
          uv sync "${extras[@]}" --dev
          uv export "${extras[@]}" --dev --no-emit-project --no-hashes -o /tmp/req.txt
          set +e
          uvx pip-audit -r /tmp/req.txt --strict --desc on > /tmp/audit.txt 2>&1
          rc=$?
          set -e
          tail -40 /tmp/audit.txt
          # 0 = clean, 1 = vulnerabilities. Anything else is pip-audit failing to
          # run, which must not read as "clean" or as "vulnerable".
          case "$rc" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            1) if grep -qE 'vulnerabilit' /tmp/audit.txt; then echo "state=vulnerable" >> "$GITHUB_OUTPUT"; else echo "::error::pip-audit exited 1 without reporting a vulnerability: it did not run"; exit 1; fi ;;
            *) echo "::error::pip-audit exited $rc: it did not run"; exit 1 ;;
          esac
      - name: Open, update or close the dependency-audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.audit.outputs.state }}
        run: |
          num=$(gh issue list --label dependency-audit --state open --json number -q '.[0].number')
          if [ "$STATE" = clean ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "pip-audit is clean again on $(date -u +%Y-%m-%d) ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."; fi
            echo "dependencies clean"; exit 0
          fi
          # shellcheck disable=SC2016  # printf format string is literal by design
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\npip-audit found a known vulnerability in a dependency already on the default branch. Bump it in a PR; that PR is audited because it changes a dependency file.\n\n```\n%s\n```\n' \
                  "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(grep -vE '^\s*$' /tmp/audit.txt | tail -60)")"
          title="dependency audit: known vulnerabilities on the default branch"
          if [ -n "$num" ]; then gh issue edit "$num" --title "$title" --body "$body" >/dev/null
          else
            gh label create dependency-audit --color B60205 --force >/dev/null
            gh issue create --label dependency-audit --title "$title" --body "$body" >/dev/null
          fi
          echo "::error::known-vulnerable dependency on the default branch; see the dependency-audit issue"; exit 1

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Weekly, on this repo's own weekday
        # Fuzz costs ~$1 of model time per run and finds crash classes that
        # change slowly, so it runs WEEKLY. The weekday is derived from the
        # repo name, so the repos sharing one OAuth token do not all fuzz on
        # the same night (8 concurrent runs exhausted the plan by 03:40 EDT,
        # 2026-09-13/14). workflow_dispatch always runs. Mutation stays nightly.
        id: day
        run: |
          n=$(printf '%s' "${{ github.repository }}" | cksum | cut -d' ' -f1)
          mine=$(( n % 7 + 1 )); today=$(date -u +%u)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$mine" = "$today" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "not this repo's fuzz day (mine=$mine today=$today); skipping" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: CLAUDE_CODE_OAUTH_TOKEN is configured
        if: steps.day.outputs.run == '1'
        env:
          KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.day.outputs.run == '1'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.day.outputs.run == '1'
      - name: Install + hypothesis
        if: steps.day.outputs.run == '1'
        run: |
          # Repo-specific system prerequisites (R for rpy2, OpenCV libs, ...) live in
          # scripts/guardrails-setup.sh so the template stays generic.
          if [ -x scripts/guardrails-setup.sh ]; then bash scripts/guardrails-setup.sh; fi
          # assignment, not inline $(...): a helper failure must stop the step
          extras_s=$(python3 scripts/uv_extras.py)
          read -ra extras <<<"$extras_s"
          uv sync "${extras[@]}" --dev
          if [ -f requirements-dev.txt ]; then uv pip install -r requirements-dev.txt; fi
          uv pip install hypothesis pytest
      - uses: anthropics/claude-code-action@4169884de317bc1b4cb1b47f4476d76fed92b384 # v1
        if: steps.day.outputs.run == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a fuzzer for ${{ github.repository }}. Budget: ~15 minutes, 30 turns.
            The hard cap is 60 and the step is RED if you pass it even after a
            successful run (figcite 2026-09-18: finished fine at turn 44 of 40,
            job red). Count generously and stop early.
            1. Identify the public entry points (console scripts in pyproject.toml,
               top-level package API, CLI parsers, MCP tool handlers).
            2. Write hypothesis property tests into fuzz_scratch/ (NOT tests/) that
               throw adversarial inputs at them: empty, huge, unicode, negative,
               NaN, path-like, nested, malformed JSON/YAML, boundary sizes.
            3. Run them with `uv run pytest fuzz_scratch -q -x --hypothesis-seed=0`.
            4. Every crash or hang that is NOT a deliberate ValueError/TypeError
               with a clear message: minimise it to a 3-line repro.
            5. If you found any, open ONE GitHub issue titled
               "fuzz: <n> crash(es) found <date>" with label `fuzz`, listing each
               repro. Reuse an open `fuzz` issue if one exists (gh issue edit).
               If none found, do nothing.
            6. After step 5 (or after deciding there is nothing to report), STOP:
               say "done" and take no further action.
            Write files with the Write tool; it creates fuzz_scratch/ itself.
            Shell: only the commands this step allows, unwrapped - no pipes,
            no `timeout`, and `uv run python`, not `python3`. Anything else is
            denied and costs a turn.
            Never modify tracked files. Never commit.
          # Edit(fuzz_scratch/**), not Write(...): a path-scoped Write rule matches
          # nothing, so until 2026-09-30 every test file was denied and the run
          # spent its turns on mkdir / python -c workarounds (14-22 denials).
          claude_args: |
            --allowed-tools "Bash(uv run pytest:*),Bash(uv run python:*),Bash(gh issue:*),Bash(gh label:*),Read,Edit(fuzz_scratch/**),Grep,Glob"
            --max-turns 60

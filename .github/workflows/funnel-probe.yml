name: funnel-probe

# Can the public internet still reach the demo deployment?
#
# The deployment being probed is plant-genomics-mcp-http on a demo host,
# published through a Tailscale Funnel. The probe has to run OFF the tailnet,
# and that is the whole measurement: checks from inside the host's network stay
# green while the inbound public path is dead (Funnel switched off by a
# tailscaled restart, an ACL edit dropping the funnel nodeAttr, a cert that
# stopped renewing, DERP trouble). MagicDNS makes an on-tailnet probe worse than
# weak: it resolves the funnel hostname to the node's 100.x address, so the check
# measures the LAN path and cannot fail. GitHub's runners are somewhere else.
#
# Failure notification is GitHub's own "scheduled workflow failed" email, on
# purpose: an alert that the demo host is unreachable must not be delivered by
# the demo host.
#
# An external monitor watches this workflow's run history, so a probe that
# silently stops being scheduled is itself alerted on. Renaming this file or the
# workflow breaks that link.
#
# The endpoint comes from two repository secrets, FUNNEL_URL (the /healthz URL)
# and FUNNEL_HOST (its hostname), so the deployment's hostname is not in the repo.

on:
  schedule:
    # Every 30 min. GitHub SILENTLY SKIPS scheduled runs under load — an hourly
    # cron measured ~9.5 deliveries/day, not 24 — so treat this as "usually
    # within an hour", and keep the external monitor's staleness threshold well
    # above it.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNNEL_URL: ${{ secrets.FUNNEL_URL }}
  FUNNEL_HOST: ${{ secrets.FUNNEL_HOST }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check the endpoint secrets are set
        # Without this, an unset secret reads as "endpoint unreachable".
        run: |
          [ -n "$FUNNEL_URL" ] || { echo "::error::FUNNEL_URL secret is not set"; exit 1; }
          [ -n "$FUNNEL_HOST" ] || { echo "::error::FUNNEL_HOST secret is not set"; exit 1; }

      - name: Probe the Funnel endpoint
        # /healthz is the one unauthenticated route (every other path needs the
        # bearer token), so it is the only thing probeable from outside without
        # shipping the bearer token to GitHub.
        #
        # 3 attempts 20s apart: a single miss over a domestic uplink must not
        # page.
        run: |
          for attempt in 1 2 3; do
            # No `|| echo 000` here: curl's own -w already prints 000 when the
            # connection fails, so the fallback appended a SECOND one and the
            # log read "HTTP 000000". Harmless to the comparison below, but the
            # first thing a human reads during an outage should not look corrupt.
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 "$FUNNEL_URL" 2>/dev/null) || true
            [ -n "$code" ] || code=000
            if [ "$code" = "200" ] && grep -q '"status":"ok"' body.txt; then
              echo "attempt $attempt: OK (HTTP $code)"
              exit 0
            fi
            echo "attempt $attempt: FAILED (HTTP $code, body: $(head -c 200 body.txt))"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::Funnel endpoint unreachable from the public internet after 3 attempts."
          exit 1

      - name: Check TLS certificate expiry
        # Tailscale renews these automatically, so this only ever fires when
        # renewal has silently stopped — precisely the failure you would
        # otherwise discover as a browser warning.
        #
        # Retries 3x like the step above, and for a reason that was MEASURED
        # rather than assumed. During the 2026-08-18 fail-test — funnel switched
        # off, probe confirmed red, funnel switched back on — the reachability
        # step recovered on its second attempt while this step, having only one,
        # failed the whole run on "could not read certificate". A handshake that
        # is a few seconds behind the HTTP path is not a stuck renewal, but a
        # one-shot check cannot tell the difference, and every such blip would
        # have paged. Any check that can be transiently wrong needs the same
        # retry discipline as its neighbours, or it becomes the noisiest thing
        # in the file and gets ignored.
        run: |
          end=""
          for attempt in 1 2 3; do
            end=$(echo | openssl s_client -servername "$FUNNEL_HOST" \
                    -connect "$FUNNEL_HOST:443" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            [ -n "$end" ] && break
            echo "attempt $attempt: could not read certificate"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          [ -n "$end" ] || { echo "::error::could not read certificate after 3 attempts"; exit 1; }
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "certificate expires in ${days}d ($end)"
          if [ "$days" -lt 7 ]; then
            echo "::error::TLS cert expires in ${days}d — Tailscale renewal appears stuck."
            exit 1
          fi

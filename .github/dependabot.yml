version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pins in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    # Template-owned (repo-template): pins are bumped there and arrive by resync.
    # Bumping them here makes this repo drift; guardrails-sync.sh --check enforces this list.
    exclude-paths:
      - ".github/workflows/guardrails.yml"
      - ".github/workflows/nightly-guardrails.yml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

# Guardrails pre-commit config (from ~/repo-template; sync with scripts/guardrails-sync.sh).
# Setup once per clone:  uvx pre-commit install
# Every rev is a commit SHA verified to exist on 2026-09-11; bump deliberately.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c # v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # House rules: each one is a bug class that has actually shipped here.
  # Negative controls for every hook live in scripts/guardrails-selftest.sh.
  - repo: local
    hooks:
      - id: no-bare-replace
        name: "AST rules: bare str.replace() no-op; except ParseError with defusedxml imported"
        language: system
        types: [python]
        entry: python3 scripts/guardrails-hooks.py

      - id: nosec-needs-reason
        name: "# nosec must name the test id AND a traced reason: '# nosec B608 - why this value is safe'"
        language: pygrep
        types: [python]
        entry: '#\s*nosec(?!:?\s*B\d+(\s*,\s*B\d+)*\s+-\s+\S)'

      - id: no-raises-bare-exception
        name: "pytest.raises(Exception) cannot tell a wrapped error from a leaked one; name the type"
        language: pygrep
        types: [python]
        # Anchored to the statement so a comment or docstring that MENTIONS the
        # anti-pattern (phylokit test_mcp_protocol.py:205, breedsim
        # test_diagnostics_and_server.py:159, both explaining why they don't do it)
        # is not a hit. A pygrep cannot tell a mention from a use; the anchor can.
        entry: '^\s*with\s+pytest\.raises\(\s*(Exception|BaseException)\s*[,)]'

      - id: no-nested-lazy
        name: "NESTED lazy quantifier (a quantified group containing *? / +?) = catastrophic backtracking"
        language: pygrep
        types: [python]
        entry: '\([^()]*[\*\+]\?[^()]*\)[\*\+\{]'

      - id: no-nohup-background
        name: "nohup ... & dies with the shell scope; use systemd-run --user --unit"
        language: pygrep
        types: [shell]
        entry: '^\s*nohup\b.*&\s*(#.*)?$'

      - id: no-uppercase-transform
        name: "text-transform: uppercase maps µ (U+00B5) to LATIN M; units read 1000x wrong"
        language: pygrep
        files: '\.(css|scss|html|svelte|vue|jsx|tsx)$'
        # Anchored to a DECLARATION (line start, `{` or `;` before it): a comment
        # that mentions the rule (wildeye style.css:9553 explains why it is
        # avoided) is not a use of it. A use over text that can never hold a
        # unit (a page title, a button) is allowed with a traced reason on the
        # same line: `/* uppercase-ok: page title, no unit text */`.
        entry: '(^\s*|[;{]\s*)text-transform\s*:\s*uppercase(?!.*uppercase-ok:\s*[^\s*/])'

      - id: no-dev-paths
        name: "absolute developer-machine paths in tracked files (real machine names only; placeholder homes pass)"
        language: pygrep
        types: [text]
        exclude: '^(\.pre-commit-config\.yaml|scripts/guardrails-selftest\.sh|\.github/workflows/.*)$'
        # Bracketed last char so this file never contains the literal it hunts
        # (a gate whose scope includes its own definition flags itself).
        entry: '/home[/]mjarnol[d]|/mnt/c[/]Users/a2b3[2]|C:\\Users\\a2b3[2]'

      # The same rule set CI runs (guardrails.yml security job: bandit -ll =
      # medium and up), on the files being committed. Until 2026-09-18 bandit
      # ran ONLY in CI: figcite 70432c5 put a B324 High (hashlib.md5 without
      # usedforsecurity=False) on master and the first anyone saw of it was a
      # red default branch blocking an unrelated PR. A finding that a hook can
      # catch belongs in the hook (CLAUDE.md section 4).
      - id: bandit-medium-plus
        name: "bandit, medium+ severity (same as CI); fix it or '# nosec Bxxx - reason'"
        language: system
        types: [python]
        exclude: '^(tests/|mutants/|fuzz_scratch/)'
        entry: uvx bandit -q -ll
